[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crispr-indel"
version = "1.0.0"
description = "CRISPR nuclease indel / knockout-efficiency quantification from amplicon sequencing (Oxford Nanopore and Illumina), built around CRISPResso2"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = ["parasail", "pyyaml", "matplotlib"]

[project.scripts]
crispr-indel = "crispr_indel.cli:main"

[tool.setuptools]
packages = ["crispr_indel"]
